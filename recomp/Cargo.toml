[package]
name = "commons-recomp"
description = "Track B: statically recompiled functions of a title, installed over its native code at load time."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
iced-x86 = "1"
serde_json = "1"
blake3 = "1"
commons-recomp-emit = { path = "emit" }

[build-dependencies]
commons-recomp-emit = { path = "emit" }
iced-x86 = { version = "1", features = ["code_asm"] }

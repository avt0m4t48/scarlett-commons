name: On-demand shader worker verification
on:
  push:
    branches: [verify/on-demand-shader-worker]
permissions:
  contents: read
jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends spirv-tools
      - run: python -I -m unittest discover -s engine/tests -p test_shader_on_demand.py -v

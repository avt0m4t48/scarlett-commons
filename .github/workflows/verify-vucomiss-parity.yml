name: VUCOMISS and parity verification
on:
  push:
    branches: [verify/recomp-vucomiss-parity]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Check source-built translated functions against native execution
        working-directory: recomp
        run: cargo test --locked -- --nocapture
      - name: Check the unmodified emitter refuses the test instruction
        working-directory: recomp
        shell: pwsh
        run: |
          git restore --source=f8a909f -- emit/src/lib.rs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = & cargo test --locked --test emit_native 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -eq 0 -or ($output -join "`n") -notmatch 'not covered: vucomiss') {
            throw 'The unmodified emitter did not reproduce the expected refusal'
          }
          exit 0

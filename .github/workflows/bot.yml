# /claim, /unclaim and /split on task issues; the sweep (ready labels, expired claims, overdue fixes, merges)
# runs whenever a task opens, closes or changes, and every 15 minutes as a fallback, so the board is never stale.
name: bot
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed, reopened, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: bot-${{ github.event_name == 'issue_comment' && 'command' || 'sweep' }}
jobs:
  command:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I bot/main.py command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sweep:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I bot/main.py sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Labels the sweep changes do not start other workflows, so it asks for a fresh progress page itself.
      - run: gh workflow run progress.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

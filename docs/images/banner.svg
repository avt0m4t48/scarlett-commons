<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Scarlett Commons: an open hybrid recompiler for Xbox Series X|S to PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b33"/>
      <stop offset="1" stop-color="#3b0d1e"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2da44e"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <!-- Text column: x 72..940. Nothing else is drawn there. -->
  <text x="72" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">Scarlett Commons</text>
  <text x="74" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1d9">An open hybrid recompiler for Xbox Series X|S → PC</text>
  <text x="74" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Runs the title's own code natively · recompiles what matters · checked on real hardware</text>
  <text x="74" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Built in the open by people and AI agents · No game data, ever</text>
  <!-- Picture column: x 1020..1208. 32 lanes of a wave: checked (colour) and not yet checked (grey). -->
  <g transform="translate(1020 92)">
    <g fill="url(#lane)">
      <rect x="0" y="0" width="18" height="18" rx="3"/><rect x="24" y="0" width="18" height="18" rx="3"/>
      <rect x="48" y="0" width="18" height="18" rx="3"/><rect x="72" y="0" width="18" height="18" rx="3"/>
      <rect x="96" y="0" width="18" height="18" rx="3"/><rect x="120" y="0" width="18" height="18" rx="3"/>
      <rect x="144" y="0" width="18" height="18" rx="3"/><rect x="168" y="0" width="18" height="18" rx="3"/>
      <rect x="0" y="24" width="18" height="18" rx="3"/><rect x="24" y="24" width="18" height="18" rx="3"/>
      <rect x="48" y="24" width="18" height="18" rx="3"/><rect x="72" y="24" width="18" height="18" rx="3"/>
      <rect x="96" y="24" width="18" height="18" rx="3"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="120" y="24" width="18" height="18" rx="3"/><rect x="144" y="24" width="18" height="18" rx="3"/>
      <rect x="168" y="24" width="18" height="18" rx="3"/>
      <rect x="0" y="48" width="18" height="18" rx="3"/><rect x="24" y="48" width="18" height="18" rx="3"/>
      <rect x="48" y="48" width="18" height="18" rx="3"/><rect x="72" y="48" width="18" height="18" rx="3"/>
      <rect x="96" y="48" width="18" height="18" rx="3"/><rect x="120" y="48" width="18" height="18" rx="3"/>
      <rect x="144" y="48" width="18" height="18" rx="3"/><rect x="168" y="48" width="18" height="18" rx="3"/>
      <rect x="0" y="72" width="18" height="18" rx="3"/><rect x="24" y="72" width="18" height="18" rx="3"/>
      <rect x="48" y="72" width="18" height="18" rx="3"/><rect x="72" y="72" width="18" height="18" rx="3"/>
      <rect x="120" y="72" width="18" height="18" rx="3"/><rect x="144" y="72" width="18" height="18" rx="3"/>
      <rect x="168" y="72" width="18" height="18" rx="3"/>
    </g>
    <rect x="96" y="72" width="18" height="18" rx="3" fill="#cf222e"/>
  </g>
</svg>

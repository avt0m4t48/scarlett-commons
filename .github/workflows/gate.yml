# Rule check for every pull request. pull_request_target gives a write token for pull requests from forks;
# it is safe only because nothing from the pull request is checked out or run: the bot reads files via the API.
name: gate
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 -I bot/main.py gate ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
